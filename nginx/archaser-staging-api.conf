# Staging API reverse proxy — api.staging.archaser.com
# Nest only. Amplify is the UI at staging.archaser.com.
#
# Install (alongside the old staging.archaser.com site until UI DNS moves):
#   sudo cp backend/nginx/archaser-staging-api.conf \
#     /etc/nginx/sites-available/archaser-staging-api
#   sudo ln -sf /etc/nginx/sites-available/archaser-staging-api \
#     /etc/nginx/sites-enabled/archaser-staging-api
#   sudo certbot certonly --nginx -d api.staging.archaser.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Upstreams here are named archaser_apihost_* so they can coexist with
# archaser-staging.conf (rollback / transition for staging.archaser.com).
#
# Public surface: /api, /auth, /health. No /metrics, /docs, or /internal.
# `/` redirects to the Amplify UI.
#
# Nest env on this host:
#   NEST_PUBLIC_URL=https://api.staging.archaser.com
#   NEST_AUTH_SUCCESS_REDIRECT=https://staging.archaser.com
#   NEST_CORS_ORIGINS=https://staging.archaser.com,<old amplifyapp.com until soak>
#   NEXT_PUBLIC_BASE_URL=https://staging.archaser.com
#   NEXT_PUBLIC_NEST_API_BASE_URL=https://api.staging.archaser.com
#
# After Amplify custom domain + smoke: disable sites-enabled/archaser-staging
# (the old hostname). Do not run deploy-staging.sh on this box.

upstream archaser_apihost_api {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream archaser_apihost_sms {
    server 127.0.0.1:3004;
    keepalive 8;
}

upstream archaser_apihost_connectors {
    server 127.0.0.1:3005;
    keepalive 8;
}

upstream archaser_apihost_reports {
    server 127.0.0.1:3006;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.staging.archaser.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.staging.archaser.com;

    ssl_certificate     /etc/letsencrypt/live/api.staging.archaser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.staging.archaser.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /api/ws {
        proxy_pass http://archaser_apihost_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/sms/ {
        proxy_pass http://archaser_apihost_sms/api/sms/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
    location = /api/sms {
        proxy_pass http://archaser_apihost_sms/api/sms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/accounts/ {
        proxy_pass http://archaser_apihost_connectors/api/accounts/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/accounts {
        proxy_pass http://archaser_apihost_connectors/api/accounts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/entities/accounts/[0-9]+/billing-connector(/|$) {
        proxy_pass http://archaser_apihost_connectors;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/entities/accounts/[0-9]+/notification-rule-sets(/|$) {
        proxy_pass http://archaser_apihost_connectors;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/reports/ {
        proxy_pass http://archaser_apihost_reports/api/reports/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/reports {
        proxy_pass http://archaser_apihost_reports/api/reports;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://archaser_apihost_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location ^~ /auth/ {
        proxy_pass http://archaser_apihost_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://archaser_apihost_api/health;
        proxy_set_header Host $host;
    }

    location / {
        return 302 https://staging.archaser.com$request_uri;
    }
}
