# Production reverse proxy for ARChaser.
# Install:
#   sudo cp backend/nginx/archaser-production.conf /etc/nginx/sites-available/archaser
#   sudo ln -sf /etc/nginx/sites-available/archaser /etc/nginx/sites-enabled/archaser
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream archaser_main {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream archaser_website {
    server 127.0.0.1:4000;
    keepalive 16;
}

upstream archaser_api {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream grafana_app {
    server 127.0.0.1:3002;
    keepalive 8;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name archaser.com www.archaser.com portal.archaser.com *.archaser.com grafana.portal.archaser.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name archaser.com www.archaser.com;

    ssl_certificate     /etc/letsencrypt/live/archaser.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archaser.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://archaser_website;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.archaser.com *.archaser.com;

    ssl_certificate     /etc/letsencrypt/live/archaser.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archaser.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Nest owns SSE/realtime (notifications + control-center).
    location ^~ /api/ws {
        proxy_pass http://archaser_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/ {
        proxy_pass http://archaser_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location ^~ /auth/ {
        proxy_pass http://archaser_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://archaser_api/health;
        proxy_set_header Host $host;
    }

    location = /metrics {
        proxy_pass http://archaser_api/metrics;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://archaser_api/docs;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://archaser_main;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.portal.archaser.com;

    ssl_certificate     /etc/letsencrypt/live/archaser.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archaser.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://grafana_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
