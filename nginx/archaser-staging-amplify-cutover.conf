# Optional: full Amplify UI cutover for staging.
# Use when Amplify hosts the UI and staging.archaser.com is API-only.
#
# Install (replaces hybrid staging site):
#   sudo cp backend/nginx/archaser-staging-amplify-cutover.conf \
#     /etc/nginx/sites-available/archaser-staging
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS checklist:
#   - Amplify custom domain (or default amplifyapp.com) → Amplify Hosting
#   - staging.archaser.com A/ALIAS → this EC2 (Nest only)
#   - Amplify env NEXT_PUBLIC_BASE_URL = Amplify UI origin
#   - Amplify env NEXT_PUBLIC_NEST_API_BASE_URL = https://staging.archaser.com
#   - Nest NEST_CORS_ORIGINS includes Amplify UI origin
#   - Nest NEST_AUTH_SUCCESS_REDIRECT points at Amplify login URL

upstream archaser_staging_api {
    server 127.0.0.1:3010;
    keepalive 16;
}

map $host $amplify_ui_origin {
    default "https://staging.d2nb6pdzevzjzz.amplifyapp.com";
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.archaser.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.archaser.com;

    ssl_certificate     /etc/letsencrypt/live/staging.archaser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.archaser.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /api/ws {
        proxy_pass http://archaser_staging_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/ {
        proxy_pass http://archaser_staging_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location ^~ /auth/ {
        proxy_pass http://archaser_staging_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://archaser_staging_api/health;
        proxy_set_header Host $host;
    }

    location = /metrics {
        proxy_pass http://archaser_staging_api/metrics;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://archaser_staging_api/docs;
        proxy_set_header Host $host;
    }

    # Browser hits to the API host land on Amplify UI.
    location / {
        return 302 $amplify_ui_origin$request_uri;
    }
}
