# Staging Grafana — nginx variant (production-style).
# Staging EC2 uses Apache 2 — prefer:
#   backend/apache/archaser-staging-grafana.conf
#
# Requires Grafana listening on 127.0.0.1:3002 (see grafana/docker-compose.logging.yml).

map $http_upgrade $connection_upgrade_grafana_staging {
    default upgrade;
    ''      close;
}

upstream grafana_staging_app {
    server 127.0.0.1:3002;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name grafana.staging.archaser.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.staging.archaser.com;

    ssl_certificate     /etc/letsencrypt/live/grafana.staging.archaser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.staging.archaser.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://grafana_staging_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_grafana_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
