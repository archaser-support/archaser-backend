# Production Grafana — grafana.portal.archaser.com
#
# Manual Setup:
#   sudo cp backend/nginx/archaser-production-grafana.conf \
#     /etc/nginx/sites-available/archaser-production-grafana.conf
#   sudo ln -sf /etc/nginx/sites-available/archaser-production-grafana.conf \
#     /etc/nginx/sites-enabled/archaser-production-grafana.conf
#   sudo certbot certonly --nginx -d grafana.portal.archaser.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires Production Grafana listening on 127.0.0.1:3201

map $http_upgrade $connection_upgrade_grafana_prod {
    default upgrade;
    ''      close;
}

upstream grafana_production_app {
    server 127.0.0.1:3201;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name grafana.portal.archaser.com grafana.production.archaser.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.portal.archaser.com grafana.production.archaser.com;

    ssl_certificate     /etc/letsencrypt/live/grafana.portal.archaser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.portal.archaser.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://grafana_production_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_grafana_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
