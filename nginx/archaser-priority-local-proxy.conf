# Localhost-only Priority OData reverse proxy (dev whitelist bypass).
#
# Priority (e.g. priweb.idigital.co.il) often allowlists the staging EC2 egress IP
# but not developer laptops. Bind this proxy to 127.0.0.1 on the EC2, then SSH
# tunnel from your laptop so Nest PriorityClient can use a loopback base URL.
#
# Install on staging EC2 (api host):
#   sudo cp nginx/archaser-priority-local-proxy.conf \
#     /etc/nginx/sites-available/archaser-priority-local-proxy
#   sudo ln -sf /etc/nginx/sites-available/archaser-priority-local-proxy \
#     /etc/nginx/sites-enabled/archaser-priority-local-proxy
#   sudo nginx -t && sudo systemctl reload nginx
#
# Laptop tunnel (leave running while developing):
#   ssh -N -L 8089:127.0.0.1:8089 ubuntu@YOUR_STAGING_EC2_HOST
#
# Local Billing connector base URL (Admin → Billing Integration):
#   http://127.0.0.1:8089/odata/Priority/tabula.ini/idigita
#
# Verify from laptop (tunnel up; AUTH = Basic base64(user:pass) or token:PAT):
#   curl -sS -G 'http://127.0.0.1:8089/odata/Priority/tabula.ini/idigita/CUSTOMERS' \
#     -H "Authorization: Basic ${AUTH}" \
#     --data-urlencode '$top=1'
#
# Security: listen is 127.0.0.1 only — not exposed on the public interface.
# Do not change listen to 0.0.0.0. Revert local connector base_url when done.
#
# Change upstream host below if this account uses a different Priority host.

upstream archaser_priority_upstream {
    server priweb.idigital.co.il:443;
    keepalive 8;
}

server {
    listen 127.0.0.1:8089;
    server_name _;

    # OData pages can be large / slow; align with PriorityClient timeouts (~180s).
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    client_max_body_size 32m;

    location / {
        proxy_pass https://archaser_priority_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name priweb.idigital.co.il;
        proxy_set_header Host priweb.idigital.co.il;
        proxy_set_header Connection "";
        proxy_buffering off;
        # Forward client Authorization (Priority Basic / PAT) unchanged.
        proxy_pass_request_headers on;
    }
}
