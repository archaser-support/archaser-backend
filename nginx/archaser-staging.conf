# Staging reverse proxy for ARChaser.
# Install:
#   sudo cp backend/nginx/archaser-staging.conf /etc/nginx/sites-available/archaser-staging
#   sudo ln -sf /etc/nginx/sites-available/archaser-staging /etc/nginx/sites-enabled/archaser-staging
#   sudo nginx -t && sudo systemctl reload nginx

upstream archaser_staging_frontend {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream archaser_staging_api {
    server 127.0.0.1:3010;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.archaser.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.archaser.com;

    ssl_certificate     /etc/letsencrypt/live/staging.archaser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.archaser.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ws {
        proxy_pass http://archaser_staging_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/auth/ {
        proxy_pass http://archaser_staging_frontend/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://archaser_staging_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location ^~ /auth/ {
        proxy_pass http://archaser_staging_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://archaser_staging_api/health;
        proxy_set_header Host $host;
    }

    location = /metrics {
        proxy_pass http://archaser_staging_api/metrics;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://archaser_staging_api/docs;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://archaser_staging_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
