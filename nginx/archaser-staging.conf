# Staging reverse proxy for ARChaser (Nest API + optional Amplify UI cutover).
# Install:
#   sudo cp backend/nginx/archaser-staging.conf /etc/nginx/sites-available/archaser-staging
#   sudo ln -sf /etc/nginx/sites-available/archaser-staging /etc/nginx/sites-enabled/archaser-staging
#   sudo nginx -t && sudo systemctl reload nginx
#
# Amplify UI cutover (DNS):
#   1. Point Amplify custom domain OR use Amplify URL as NEXT_PUBLIC_BASE_URL.
#   2. Keep staging.archaser.com on this EC2 nginx for Nest (/api, /auth, /api/ws).
#   3. Set amplify_ui_origin map below and switch `location /` to the Amplify redirect block.
#   4. Nest NEST_CORS_ORIGINS must include the Amplify origin.

upstream archaser_staging_frontend {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream archaser_staging_api {
    server 127.0.0.1:3010;
    keepalive 16;
}

# SMS Nest app (D24–D25). Flip: keep this upstream; toggle location ^~ /api/sms/ below.
upstream archaser_staging_sms {
    server 127.0.0.1:3004;
    keepalive 8;
}

# Connectors Nest — reversible path flip (D70). Enable locations after soak.
upstream archaser_staging_connectors {
    server 127.0.0.1:3005;
    keepalive 8;
}

# Reports Nest — reversible path flip. Enable locations after soak.
upstream archaser_staging_reports {
    server 127.0.0.1:3006;
    keepalive 8;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Amplify Hosting origin for UI DNS cutover (override when ready).
map $host $amplify_ui_origin {
    default "https://staging.d2nb6pdzevzjzz.amplifyapp.com";
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.archaser.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.archaser.com;

    ssl_certificate     /etc/letsencrypt/live/staging.archaser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.archaser.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Nest owns SSE/realtime (notifications + control-center).
    location ^~ /api/ws {
        proxy_pass http://archaser_staging_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # NextAuth cookie bridge (Amplify also hosts its own /api/auth).
    location ^~ /api/auth/ {
        proxy_pass http://archaser_staging_frontend/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SMS peel (D36) — staging flipped ---
    location ^~ /api/sms/ {
        proxy_pass http://archaser_staging_sms/api/sms/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
    location = /api/sms {
        proxy_pass http://archaser_staging_sms/api/sms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Connectors peel (D70) — /api/accounts + billing/notification leaves only ---
    # Do NOT send all /api/entities/accounts/* here (account-admin bank-accounts/BUs stay on main API).
    location ^~ /api/accounts/ {
        proxy_pass http://archaser_staging_connectors/api/accounts/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/accounts {
        proxy_pass http://archaser_staging_connectors/api/accounts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/entities/accounts/[0-9]+/billing-connector(/|$) {
        proxy_pass http://archaser_staging_connectors;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/entities/accounts/[0-9]+/notification-rule-sets(/|$) {
        proxy_pass http://archaser_staging_connectors;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Reports peel ---
    location ^~ /api/reports/ {
        proxy_pass http://archaser_staging_reports/api/reports/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/reports {
        proxy_pass http://archaser_staging_reports/api/reports;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://archaser_staging_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location ^~ /auth/ {
        proxy_pass http://archaser_staging_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://archaser_staging_api/health;
        proxy_set_header Host $host;
    }

    location = /metrics {
        proxy_pass http://archaser_staging_api/metrics;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://archaser_staging_api/docs;
        proxy_set_header Host $host;
    }

    # --- UI routing ---
    # Amplify SSR cutover (Stage 1B): UI on Amplify; Nest APIs stay on this host.
    # Rollback hybrid: comment this block and restore proxy_pass to archaser_staging_frontend.
    location / {
        return 302 $amplify_ui_origin$request_uri;
    }

    # Hybrid EC2 Next UI (rollback):
    # location / {
    #     proxy_pass http://archaser_staging_frontend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    #     proxy_read_timeout 86400;
    # }
}
