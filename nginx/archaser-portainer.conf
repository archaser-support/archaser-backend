# Nginx reverse proxy configuration for Portainer CE on EC2
# Subdomain for Portainer CE on archaser.com

server {
    listen 80;
    server_name portainer.archaser.com portainer.staging.archaser.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portainer.archaser.com portainer.staging.archaser.com;

    # SSL configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/portainer.archaser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portainer.archaser.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        # WebSocket support (required for Portainer live container console / logs stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for live console / logs streaming
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
