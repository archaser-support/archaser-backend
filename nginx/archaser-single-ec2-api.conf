# Single EC2 Nginx configuration for both Staging & Production APIs
# Host: Single EC2 instance
# Domains:
#   - api.staging.archaser.com (ports: API 3010, SMS 3004, Connectors 3005, Reports 3006)
#   - api.production.archaser.com (ports: API 4010, SMS 4004, Connectors 4005, Reports 4006)

# ==============================================================================
# UPSTREAMS - STAGING (30xx)
# ==============================================================================
upstream archaser_staging_apihost_api {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream archaser_staging_apihost_sms {
    server 127.0.0.1:3004;
    keepalive 8;
}

upstream archaser_staging_apihost_connectors {
    server 127.0.0.1:3005;
    keepalive 8;
}

upstream archaser_staging_apihost_reports {
    server 127.0.0.1:3006;
    keepalive 8;
}

# ==============================================================================
# UPSTREAMS - PRODUCTION (40xx)
# ==============================================================================
upstream archaser_production_apihost_api {
    server 127.0.0.1:4010;
    keepalive 16;
}

upstream archaser_production_apihost_sms {
    server 127.0.0.1:4004;
    keepalive 8;
}

upstream archaser_production_apihost_connectors {
    server 127.0.0.1:4005;
    keepalive 8;
}

upstream archaser_production_apihost_reports {
    server 127.0.0.1:4006;
    keepalive 8;
}

# ==============================================================================
# SERVER BLOCK: api.staging.archaser.com (HTTP -> HTTPS)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.staging.archaser.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# SERVER BLOCK: api.staging.archaser.com (HTTPS)
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.staging.archaser.com;

    ssl_certificate     /etc/letsencrypt/live/api.staging.archaser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.staging.archaser.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /api/ws {
        proxy_pass http://archaser_staging_apihost_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/sms/ {
        proxy_pass http://archaser_staging_apihost_sms/api/sms/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
    location = /api/sms {
        proxy_pass http://archaser_staging_apihost_sms/api/sms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/accounts/ {
        proxy_pass http://archaser_staging_apihost_connectors/api/accounts/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/accounts {
        proxy_pass http://archaser_staging_apihost_connectors/api/accounts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/entities/accounts/[0-9]+/billing-connector(/|$) {
        proxy_pass http://archaser_staging_apihost_connectors;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/entities/accounts/[0-9]+/notification-rule-sets(/|$) {
        proxy_pass http://archaser_staging_apihost_connectors;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/reports/ {
        proxy_pass http://archaser_staging_apihost_reports/api/reports/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/reports {
        proxy_pass http://archaser_staging_apihost_reports/api/reports;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://archaser_staging_apihost_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location ^~ /auth/ {
        proxy_pass http://archaser_staging_apihost_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://archaser_staging_apihost_api/health;
        proxy_set_header Host $host;
    }

    location / {
        return 302 https://staging.archaser.com$request_uri;
    }
}

