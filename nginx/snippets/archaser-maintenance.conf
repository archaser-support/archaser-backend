# Shown when nginx itself cannot reach an upstream (process stopped during deploy).
# Does not replace error bodies returned by a live upstream.
# Installed to /etc/nginx/snippets/archaser-maintenance.conf by the nginx setup scripts.
# Include once inside each HTTPS server that proxies the app or API.

error_page 502 503 504 =503 @archaser_maintenance;

location @archaser_maintenance {
    default_type text/html;
    charset utf-8;
    # 503 (not 200): Amplify UI probes /health and must see an outage status.
    # CORS: Nest normally adds these; when upstream is down nginx must, or the
    # browser hides the status from the SPA and the overlay never opens.
    # No Allow-Credentials: health probe uses credentials:omit; * is valid then.
    add_header Cache-Control "no-store" always;
    add_header Retry-After "15" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-Token,X-CID,X-Pathname,X-Search,X-I18n-Skip,Sentry-Trace,Baggage" always;
    return 503 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="15"><title>ARchaser</title></head><body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f7f8fa;color:#1a1a1a"><main style="max-width:32rem;padding:2rem;text-align:center"><h1 style="font-size:1.5rem;font-weight:600;margin:0 0 0.75rem">ARchaser is being updated</h1><p style="margin:0 0 1.5rem;line-height:1.5">A new version is being deployed. This page will refresh on its own in a few seconds.</p><h1 dir="rtl" lang="he" style="font-size:1.5rem;font-weight:600;margin:0 0 0.75rem">ARchaser מתעדכן</h1><p dir="rtl" lang="he" style="margin:0;line-height:1.5">גרסה חדשה עולה עכשיו. הדף יתרענן מעצמו בעוד כמה שניות.</p></main></body></html>';
}
