services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - archaser-redis-staging-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: node:20-alpine
    working_dir: /workspace/backend
    command: sh -lc "npm run start:api"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEST_PORT: 3010
      PORT: 3010
      SERVICE_NAME: archaser-api-staging
      REDIS_URL: redis://redis:6379
      BULLMQ_ENABLED: "true"
      BULLMQ_QUEUE: archaser-cron
      SMS_SERVICE_URL: http://sms:3004
      CONNECTORS_SERVICE_URL: http://connectors:3005
      REPORTS_SERVICE_URL: http://reports:3006
      # Worker owns CronJob schedules after Stage 2 soak (D15).
      ENABLE_CRON_JOBS: "false"
      ENABLE_CONNECTORS_SYNC_WORKERS: "false"
      CONNECTION_LIMIT_API: "10"
    volumes:
      - /home/ubuntu/staging:/workspace
    ports:
      - "3010:3010"
    depends_on:
      redis:
        condition: service_healthy
      sms:
        condition: service_started
    restart: unless-stopped

  worker:
    image: node:20-alpine
    working_dir: /workspace/backend
    command: sh -lc "npm run start -w @archaser/worker"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WORKER_PORT: 3003
      REDIS_URL: redis://redis:6379
      BULLMQ_QUEUE: archaser-cron
      CONNECTION_LIMIT_WORKER: 5
      SMS_SERVICE_URL: http://sms:3004
      CONNECTORS_SERVICE_URL: http://connectors:3005
      REPORTS_SERVICE_URL: http://reports:3006
      ENABLE_CONNECTORS_SYNC_WORKERS: "false"
    volumes:
      - /home/ubuntu/staging:/workspace
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
      sms:
        condition: service_started
    restart: unless-stopped

  sms:
    image: node:20-alpine
    working_dir: /workspace/backend
    command: sh -lc "npm run start -w @archaser/sms"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SMS_PORT: 3004
      CONNECTION_LIMIT_SMS: 5
    volumes:
      - /home/ubuntu/staging:/workspace
    ports:
      - "3004:3004"
    restart: unless-stopped

  connectors:
    image: node:20-alpine
    working_dir: /workspace/backend
    command: sh -lc "npm run start -w @archaser/connectors"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CONNECTORS_PORT: 3005
      # Path flip enabled on staging nginx — connectors owns sync schedules (D72).
      ENABLE_CONNECTORS_SYNC_WORKERS: "true"
      REDIS_URL: redis://redis:6379
    volumes:
      - /home/ubuntu/staging:/workspace
    ports:
      - "3005:3005"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  reports:
    image: node:20-alpine
    working_dir: /workspace/backend
    command: sh -lc "npm run start -w @archaser/reports"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REPORTS_PORT: 3006
    volumes:
      - /home/ubuntu/staging:/workspace
    ports:
      - "3006:3006"
    restart: unless-stopped

volumes:
  archaser-redis-staging-data:
