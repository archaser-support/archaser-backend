services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - archaser-redis-staging-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: node:20-alpine
    working_dir: /workspace/backend
    command: sh -lc "npm run start:api"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEST_PORT: 3010
      PORT: 3010
      SERVICE_NAME: archaser-api-staging
      # In-compose hostname (overrides host .env 127.0.0.1)
      REDIS_URL: redis://redis:6379
      BULLMQ_ENABLED: "true"
      BULLMQ_QUEUE: archaser-cron
    volumes:
      - /home/ubuntu/staging:/workspace
    ports:
      - "3010:3010"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: node:20-alpine
    working_dir: /workspace/backend
    command: sh -lc "npm run start -w @archaser/worker"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WORKER_PORT: 3003
      REDIS_URL: redis://redis:6379
      BULLMQ_QUEUE: archaser-cron
      CONNECTION_LIMIT_WORKER: 5
    volumes:
      - /home/ubuntu/staging:/workspace
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  sms:
    image: node:20-alpine
    working_dir: /workspace/backend
    command: sh -lc "npm run start -w @archaser/sms"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SMS_PORT: 3004
    volumes:
      - /home/ubuntu/staging:/workspace
    restart: unless-stopped

  connectors:
    image: node:20-alpine
    working_dir: /workspace/backend
    command: sh -lc "npm run start -w @archaser/connectors"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CONNECTORS_PORT: 3005
    volumes:
      - /home/ubuntu/staging:/workspace
    restart: unless-stopped

  reports:
    image: node:20-alpine
    working_dir: /workspace/backend
    command: sh -lc "npm run start -w @archaser/reports"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REPORTS_PORT: 3006
    volumes:
      - /home/ubuntu/staging:/workspace
    restart: unless-stopped

volumes:
  archaser-redis-staging-data:
