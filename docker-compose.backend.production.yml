# Production Nest stack on the API EC2 (api.production.archaser.com).
# Redis is docker-internal. Nest ports bind 127.0.0.1 for host nginx.
# Public TLS is nginx on the host — see nginx/archaser-production-api.conf.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - archaser-redis-production-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: node:20-bookworm-slim
    working_dir: /workspace
    command: sh -lc "npm run start:api"
    env_file:
      - .env.production
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      NEST_PORT: 4010
      PORT: 4010
      SERVICE_NAME: archaser-api-production
      NEST_PUBLIC_URL: "https://api.production.archaser.com"
      NEXT_PUBLIC_BASE_URL: "https://production.archaser.com"
      NEST_AUTH_SUCCESS_REDIRECT: "https://production.archaser.com/login"
      NEST_CORS_ORIGINS: "https://production.archaser.com,https://www.production.archaser.com,https://api.production.archaser.com,https://portal.archaser.com,https://www.portal.archaser.com,https://archaser.com,https://www.archaser.com,https://main.d2nb6pdzevzjzz.amplifyapp.com,https://master.d2nb6pdzevzjzz.amplifyapp.com,https://staging.d2nb6pdzevzjzz.amplifyapp.com"
      REDIS_URL: redis://redis:6379
      BULLMQ_ENABLED: "true"
      BULLMQ_QUEUE: archaser-cron-prod
      SMS_SERVICE_URL: http://sms:3004
      CONNECTORS_SERVICE_URL: http://connectors:3005
      REPORTS_SERVICE_URL: http://reports:3006
      ENABLE_CONNECTORS_SYNC_WORKERS: "false"
      CONNECTION_LIMIT_API: "10"
      ENABLE_LOKI_LOGGING: "true"
      LOKI_HOST: http://host.docker.internal:3100
    volumes:
      - ${BACKEND_HOST_DIR:-/home/ubuntu/production}:/workspace
    ports:
      - "127.0.0.1:4010:4010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      sms:
        condition: service_started
    restart: unless-stopped

  worker:
    image: node:20-bookworm-slim
    working_dir: /workspace
    command: sh -lc "npm run start -w @archaser/worker"
    env_file:
      - .env.production
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      WORKER_PORT: 4003
      REDIS_URL: redis://redis:6379
      BULLMQ_QUEUE: archaser-cron-prod
      CONNECTION_LIMIT_WORKER: 5
      SMS_SERVICE_URL: http://sms:3004
      CONNECTORS_SERVICE_URL: http://connectors:3005
      REPORTS_SERVICE_URL: http://reports:3006
      ENABLE_CONNECTORS_SYNC_WORKERS: "false"
      ENABLE_LOKI_LOGGING: "true"
      LOKI_HOST: http://host.docker.internal:3100
    volumes:
      - ${BACKEND_HOST_DIR:-/home/ubuntu/production}:/workspace
    ports:
      - "127.0.0.1:4003:4003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      sms:
        condition: service_started
    restart: unless-stopped

  sms:
    image: node:20-bookworm-slim
    working_dir: /workspace
    command: sh -lc "npm run start -w @archaser/sms"
    env_file:
      - .env.production
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      SMS_PORT: 3004
      CONNECTION_LIMIT_SMS: 5
      NEXT_PUBLIC_BASE_URL: "https://production.archaser.com"
      NEST_CORS_ORIGINS: "https://production.archaser.com,https://www.production.archaser.com,https://api.production.archaser.com,https://portal.archaser.com,https://www.portal.archaser.com,https://archaser.com,https://www.archaser.com,https://main.d2nb6pdzevzjzz.amplifyapp.com,https://master.d2nb6pdzevzjzz.amplifyapp.com,https://staging.d2nb6pdzevzjzz.amplifyapp.com"
    volumes:
      - ${BACKEND_HOST_DIR:-/home/ubuntu/production}:/workspace
    ports:
      - "127.0.0.1:4004:3004"
    restart: unless-stopped

  connectors:
    image: node:20-bookworm-slim
    working_dir: /workspace
    command: sh -lc "npm run start -w @archaser/connectors"
    env_file:
      - .env.production
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      CONNECTORS_PORT: 3005
      ENABLE_CONNECTORS_SYNC_WORKERS: "true"
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_BASE_URL: "https://production.archaser.com"
      NEST_CORS_ORIGINS: "https://production.archaser.com,https://www.production.archaser.com,https://api.production.archaser.com,https://portal.archaser.com,https://www.portal.archaser.com,https://archaser.com,https://www.archaser.com,https://main.d2nb6pdzevzjzz.amplifyapp.com,https://master.d2nb6pdzevzjzz.amplifyapp.com,https://staging.d2nb6pdzevzjzz.amplifyapp.com"
    volumes:
      - ${BACKEND_HOST_DIR:-/home/ubuntu/production}:/workspace
    ports:
      - "127.0.0.1:4005:3005"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  reports:
    image: node:20-bookworm-slim
    working_dir: /workspace
    command: sh -lc "npm run start -w @archaser/reports"
    env_file:
      - .env.production
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      REPORTS_PORT: 3006
      NEXT_PUBLIC_BASE_URL: "https://production.archaser.com"
      NEST_CORS_ORIGINS: "https://production.archaser.com,https://www.production.archaser.com,https://api.production.archaser.com,https://portal.archaser.com,https://www.portal.archaser.com,https://archaser.com,https://www.archaser.com,https://main.d2nb6pdzevzjzz.amplifyapp.com,https://master.d2nb6pdzevzjzz.amplifyapp.com,https://staging.d2nb6pdzevzjzz.amplifyapp.com"
    volumes:
      - ${BACKEND_HOST_DIR:-/home/ubuntu/production}:/workspace
    ports:
      - "127.0.0.1:4006:3006"
    restart: unless-stopped

volumes:
  archaser-redis-production-data:
