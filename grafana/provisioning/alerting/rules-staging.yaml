apiVersion: 1

groups:
  - orgId: 1
    name: System Health Alerts - Staging
    folder: Staging
    interval: 1m
    rules:
      # ============================================================
      # Critical Alerts - Database Health
      # ============================================================
      - uid: postgres-disconnected-stag
        title: PostgreSQL Disconnected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_db_postgres_connected{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: KeepLast
        for: 2m
        annotations:
          summary: PostgreSQL database connection lost
          description: "The application cannot connect to PostgreSQL. This is a critical issue that may affect all operations."
        labels:
          severity: critical
          type: database

      - uid: mongodb-disconnected-stag
        title: MongoDB Disconnected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_db_mongodb_connected{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: MongoDB database connection lost
          description: "The application cannot connect to MongoDB. Logging functionality may be affected."
        labels:
          severity: critical
          type: database

      # ============================================================
      # High Priority Alerts - Cron Jobs & Activities
      # ============================================================
      - uid: stuck-activities-stag
        title: Stuck Activities Detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_activities_stuck{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          alert_details_type: "stuck_activities"
          summary: "Stuck activities detected ({{ $values.A.Value }})"
          description: "SCHEDULED system-generated activities are more than 2 hours past schedule_time. Email lists account/customer/activity IDs. Check Activity Workflow Manager Phase 1 (send due activities)."
        labels:
          severity: high
          type: activities

      - uid: no-system-activities-24h-stag
        title: No System Activities Created in 24 Hours
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_hours_since_last_system_activity{instance="Staging"}
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions: []
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions: []
              expression: $B > 24
              refId: C
              type: math
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          alert_details_type: "no_system_activities_24h"
          summary: 'No system-generated activities created in over {{ $values.B.Value }} hours'
          description: "No automated activities created in >24h. Email includes last system activity and last runs of Activity Workflow Manager / Process Automated Collection Periods."
        labels:
          severity: high
          type: activities

      - uid: cron-jobs-overdue-stag
        title: Cron Jobs Overdue
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_cron_jobs_overdue{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          alert_details_type: "cron_jobs_overdue"
          summary: "Cron jobs are overdue ({{ $values.A.Value }})"
          description: "Active cron jobs are 5+ minutes past next_run_at. Email lists overdue job names, last/next run, and failure counts."
        labels:
          severity: medium
          type: cron

      - uid: cron-jobs-not-run-24h-stag
        title: Cron Jobs Not Run in 24 Hours
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_cron_jobs_not_run_24h{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          alert_details_type: "cron_jobs_not_run_24h"
          summary: "Cron jobs have not run in 24 hours ({{ $values.A.Value }})"
          description: "Active cron jobs have last_run_at older than 24h (or never). Email lists job names, last/next run, and failure counts."
        labels:
          severity: high
          type: cron

      - uid: cron-jobs-failed-execution-stag
        title: Cron Jobs Failed Execution
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: increase(archaser_cron_job_executions_total{status="FAILED", instance="Staging"}[15m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 0m
        annotations:
          summary: "One or more cron jobs failed execution"
          description: "At least one cron job recorded a FAILED execution in the last 15 minutes. Check the ARchaser Cron dashboard (uid archaser-cron-v1-staging) for per-job failure counts and CronJobExecution logs / application logs for error details."
        labels:
          severity: high
          type: cron

      - uid: bullmq-cron-queue-waiting-stag
        title: Worker Cron Queue Waiting High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_bullmq_queue_waiting{instance="Staging",queue="cron"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          alert_details_type: "bullmq_cron_queue_backlog"
          summary: "Main cron BullMQ waiting jobs high ({{ $values.A.Value }})"
          description: "Worker cron queue waiting count stayed above 5 for 10m. Email lists waiting/active/failed plus sample waiting job ids."
        labels:
          severity: medium
          type: cron

      - uid: bullmq-backfill-queue-waiting-stag
        title: Worker Backfill Queue Waiting High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_bullmq_queue_waiting{instance="Staging",queue="credit_asof_backfill"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          alert_details_type: "bullmq_backfill_queue_backlog"
          summary: "Credit as-of backfill BullMQ waiting jobs high ({{ $values.A.Value }})"
          description: "Backfill queue waiting count stayed above 20 for 10m. Email lists waiting/active/failed plus sample waiting job ids."
        labels:
          severity: medium
          type: cron

      - uid: bullmq-vat-queue-waiting-stag
        title: Worker VAT Queue Waiting High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_bullmq_queue_waiting{instance="Staging",queue="account_vat_basis_refresh"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          alert_details_type: "bullmq_vat_queue_backlog"
          summary: "VAT basis refresh BullMQ waiting jobs high ({{ $values.A.Value }})"
          description: "VAT refresh queue waiting count stayed above 10 for 10m. Email lists waiting/active/failed plus sample waiting job ids."
        labels:
          severity: medium
          type: cron

      # ============================================================
      # High Priority Alerts - Collection Periods
      # ============================================================
      - uid: periods-without-activities-stag
        title: Automated Periods Without Activities
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_periods_without_activities{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          alert_details_type: "periods_without_activities"
          summary: "Automated periods have no scheduled activities ({{ $values.A.Value }})"
          description: "Open Automated periods with next_activity_date null/stale (>24h) and no SCHEDULED automated activity. Email lists accounts/customers plus likely_cause."
        labels:
          severity: high
          type: collection

      - uid: overdue-activity-creation-stag
        title: Overdue Activity Creation
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_overdue_activity_creation{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 15m
        annotations:
          alert_details_type: "overdue_activity_creation"
          summary: "Collection periods have overdue activity creation ({{ $values.A.Value }} periods)"
          description: "create_next_activity=true and next_activity_date is in the past. Email includes affected accounts/customers plus likely_cause (import freeze, no active user, credit-only, stuck no contacts, or workflow backlog). Check Activity Workflow Manager cron; drilldown panel Overdue Activity Creation."
        labels:
          severity: high
          type: collection

      - uid: automation-stuck-no-contacts-stag
        title: Automation Stuck - No Contacts
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_automation_stuck_no_contacts{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 1h
        annotations:
          alert_details_type: "automation_stuck_no_contacts"
          summary: "Collection periods stuck due to no contacts ({{ $values.A.Value }})"
          description: "Customers with automation_stuck_no_contacts=true. Email lists account/customer/open period. Add valid contacts then clear the stuck flag."
        labels:
          severity: medium
          type: collection

      # ============================================================
      # Medium Priority Alerts - Communication Issues
      # ============================================================
      - uid: high-email-bounces-stag
        title: High Email Bounce Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_emails_bounced_24h{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          alert_details_type: "high_email_bounces"
          summary: "High number of emails bounced in the last 24 hours ({{ $values.A.Value }})"
          description: "Email activities with status BOUNCED in the last 24h. Email lists account/customer/activity. Check addresses and SMTP/SES reputation."
        labels:
          severity: medium
          type: email

      - uid: high-sms-failures-stag
        title: High SMS Failure Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_sms_failed_24h{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          alert_details_type: "high_sms_failures"
          summary: "High number of SMS failures in the last 24 hours ({{ $values.A.Value }})"
          description: "SMS activities with status FAILED in the last 24h. Email lists account/customer/activity. Check SMS vendor config and mobile numbers."
        labels:
          severity: medium
          type: sms

      # ============================================================
      # Medium Priority Alerts - Application Errors
      # ============================================================
      - uid: high-application-errors-stag
        title: High Application Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_errors_1h{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 50
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "High number of application errors in the last hour"
          description: "High number of application errors detected. Check application logs for details."
        labels:
          severity: high
          type: errors

  # ============================================================
  # Postgres server logs (RDS → CloudWatch → Loki) — Staging
  # Folder Staging → silent-staging (no production SNS paging)
  # ============================================================
  - orgId: 1
    name: Postgres Server Logs - Staging
    folder: Staging
    interval: 1m
    rules:
      - uid: postgres-fatal-panic-stag
        title: PostgreSQL FATAL or PANIC
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              editorMode: code
              expr: sum(count_over_time({job="rds-postgres", environment="staging", error_severity=~"FATAL|PANIC"}[5m]))
              queryType: instant
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: PostgreSQL FATAL or PANIC in server logs
          description: "Staging FATAL/PANIC in RDS Postgres logs. Dashboard: https://grafana.staging.archaser.com/d/archaser-postgres-logs-stag/postgres-logs-staging"
        labels:
          severity: critical
          type: database
          source: rds-postgres

      - uid: postgres-error-rate-spike-stag
        title: PostgreSQL Error Rate Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: Loki
            model:
              editorMode: code
              expr: sum(count_over_time({job="rds-postgres", environment="staging", error_severity="ERROR"}[10m]))
              queryType: instant
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Elevated PostgreSQL ERROR volume
          description: "Staging ERROR-rate spike in RDS Postgres logs. Dashboard: https://grafana.staging.archaser.com/d/archaser-postgres-logs-stag/postgres-logs-staging"
        labels:
          severity: high
          type: database
          source: rds-postgres

  # ============================================================
  # Billing Connector — Staging (alerts 1–11, silent via Staging folder)
  # Production parity: grafana/provisioning/alerting/rules-production.yaml
  # ============================================================
  - orgId: 1
    name: Billing Connector - Staging
    folder: Staging
    interval: 1m
    rules:
      - uid: bc-auth-failures-stag
        title: Billing Connector Auth Failures
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: Prometheus
            model:
              expr: sum(increase(archaser_billing_connector_errors_total{instance="Staging", error_type="auth"}[1h])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Repeated ERP authentication failures (staging)
          description: "Priority/auth errors exceeded threshold. Check credentials. Dashboard: https://grafana.staging.archaser.com/d/archaser-billing-connector-stag/billing-connector-staging — filter Loki by account_id."
        labels:
          severity: critical
          type: billing_connector

      - uid: bc-in-error-stag
        title: Billing Connectors In Error State
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: sum(archaser_billing_connector_connectors_in_error{instance="Staging", nest_service="archaser-api"}) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: One or more billing connectors in Error status (staging)
          description: "Connector circuit breaker or connection failure. Admin → Billing integration. Dashboard: https://grafana.staging.archaser.com/d/archaser-billing-connector-stag/billing-connector-staging"
        labels:
          severity: critical
          type: billing_connector

      - uid: bc-stale-incremental-stag
        title: Billing Connector No Incremental Success 24h
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_billing_connector_stale_incremental_count{instance="Staging", nest_service="archaser-api"} or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 15m
        annotations:
          summary: Incremental connector(s) without success in 24h (staging)
          description: "Check schedule, Loki finish lines, and Mongo sync history. Dashboard: https://grafana.staging.archaser.com/d/archaser-billing-connector-stag/billing-connector-staging"
        labels:
          severity: high
          type: billing_connector

      - uid: bc-incr-failed-stag
        title: Billing Connector Incremental FAILED or TIMEOUT
        condition: C
        data:
          - refId: A
