apiVersion: 1

groups:
  - orgId: 1
    name: System Health Alerts - Staging
    folder: Staging
    interval: 1m
    rules:
      # ============================================================
      # Critical Alerts - Database Health
      # ============================================================
      - uid: postgres-disconnected-stag
        title: PostgreSQL Disconnected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_db_postgres_connected{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: KeepLast
        for: 2m
        annotations:
          summary: PostgreSQL database connection lost
          description: "The application cannot connect to PostgreSQL. This is a critical issue that may affect all operations."
        labels:
          severity: critical
          type: database

      - uid: mongodb-disconnected-stag
        title: MongoDB Disconnected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_db_mongodb_connected{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: MongoDB database connection lost
          description: "The application cannot connect to MongoDB. Logging functionality may be affected."
        labels:
          severity: critical
          type: database

      # ============================================================
      # High Priority Alerts - Cron Jobs & Activities
      # ============================================================
      - uid: stuck-activities-stag
        title: Stuck Activities Detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_activities_stuck{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Stuck activities detected"
          description: "Activities with SCHEDULED status have passed their schedule_time by more than 2 hours. Check Activity Workflow Manager cron job."
        labels:
          severity: high
          type: activities

      - uid: no-system-activities-24h-stag
        title: No System Activities Created in 24 Hours
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_hours_since_last_system_activity{instance="Staging"}
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions: []
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions: []
              expression: $B > 24
              refId: C
              type: math
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          summary: 'No system-generated activities created in over {{ $values.B.Value }} hours'
          description: "The system has not created any automated activities in more than 24 hours. Check Activity Workflow Manager and Process Automated Collection Periods cron jobs."
        labels:
          severity: high
          type: activities

      - uid: cron-jobs-overdue-stag
        title: Cron Jobs Overdue
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_cron_jobs_overdue{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Cron jobs are overdue"
          description: "Cron jobs have not run when they were scheduled. Check cron manager for issues."
        labels:
          severity: medium
          type: cron

      - uid: cron-jobs-not-run-24h-stag
        title: Cron Jobs Not Run in 24 Hours
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_cron_jobs_not_run_24h{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Cron jobs have not run in 24 hours"
          description: "Some cron jobs have not executed in the last 24 hours. This may indicate cron manager issues."
        labels:
          severity: high
          type: cron

      - uid: cron-jobs-failed-execution-stag
        title: Cron Jobs Failed Execution
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: increase(archaser_cron_job_executions_total{status="FAILED", instance="Staging"}[15m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 0m
        annotations:
          summary: "One or more cron jobs failed execution"
          description: "At least one cron job recorded a FAILED execution in the last 15 minutes. Check the ARchaser Cron dashboard (uid archaser-cron-v1-staging) for per-job failure counts and CronJobExecution logs / application logs for error details."
        labels:
          severity: high
          type: cron

      # ============================================================
      # High Priority Alerts - Collection Periods
      # ============================================================
      - uid: periods-without-activities-stag
        title: Automated Periods Without Activities
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_periods_without_activities{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          summary: "Automated periods have no scheduled activities"
          description: "Automated collection periods exist without any scheduled activities for over 24 hours."
        labels:
          severity: high
          type: collection

      - uid: overdue-activity-creation-stag
        title: Overdue Activity Creation
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_overdue_activity_creation{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 15m
        annotations:
          summary: "Collection periods have overdue activity creation"
          description: "Collection periods with create_next_activity=true have passed their next_activity_date."
        labels:
          severity: high
          type: collection

      - uid: automation-stuck-no-contacts-stag
        title: Automation Stuck - No Contacts
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_automation_stuck_no_contacts{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 1h
        annotations:
          summary: "Collection periods stuck due to no contacts"
          description: "Automated collection periods cannot proceed because customers have no valid contacts."
        labels:
          severity: medium
          type: collection

      # ============================================================
      # Medium Priority Alerts - Communication Issues
      # ============================================================
      - uid: high-email-bounces-stag
        title: High Email Bounce Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_emails_bounced_24h{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          summary: "High number of emails bounced in the last 24 hours"
          description: "High number of email bounces detected. Check email service configuration and contact data quality."
        labels:
          severity: medium
          type: email

      - uid: high-sms-failures-stag
        title: High SMS Failure Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_sms_failed_24h{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          summary: "High number of SMS failures in the last 24 hours"
          description: "High number of SMS failures detected. Check SMS vendor configuration."
        labels:
          severity: medium
          type: sms

      # ============================================================
      # Medium Priority Alerts - Application Errors
      # ============================================================
      - uid: high-application-errors-stag
        title: High Application Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_errors_1h{instance="Staging"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 50
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "High number of application errors in the last hour"
          description: "High number of application errors detected. Check application logs for details."
        labels:
          severity: high
          type: errors

  # ============================================================
  # Postgres server logs (RDS → CloudWatch → Loki) — Staging
  # Folder Staging → silent-staging (no production SNS paging)
  # ============================================================
  - orgId: 1
    name: Postgres Server Logs - Staging
    folder: Staging
    interval: 1m
    rules:
      - uid: postgres-fatal-panic-stag
        title: PostgreSQL FATAL or PANIC
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              editorMode: code
              expr: sum(count_over_time({job="rds-postgres", environment="staging", error_severity=~"FATAL|PANIC"}[5m]))
              queryType: instant
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: PostgreSQL FATAL or PANIC in server logs
          description: "Staging FATAL/PANIC in RDS Postgres logs. Dashboard: /d/archaser-postgres-logs-stag/postgres-logs-staging"
        labels:
          severity: critical
          type: database
          source: rds-postgres

      - uid: postgres-error-rate-spike-stag
        title: PostgreSQL Error Rate Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: Loki
            model:
              editorMode: code
              expr: sum(count_over_time({job="rds-postgres", environment="staging", error_severity="ERROR"}[10m]))
              queryType: instant
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Elevated PostgreSQL ERROR volume
          description: "Staging ERROR-rate spike in RDS Postgres logs. Dashboard: /d/archaser-postgres-logs-stag/postgres-logs-staging"
        labels:
          severity: high
          type: database
          source: rds-postgres

  # ============================================================
  # Billing Connector — Staging (alerts 1–11, silent via Staging folder)
  # Production copy is follow-up after soak (Phase 5).
  # ============================================================
  - orgId: 1
    name: Billing Connector - Staging
    folder: Staging
    interval: 1m
    rules:
      - uid: bc-auth-failures-stag
        title: Billing Connector Auth Failures
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: Prometheus
            model:
              expr: sum(increase(archaser_billing_connector_errors_total{instance="Staging", error_type="auth"}[1h])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Repeated ERP authentication failures (staging)
          description: "Priority/auth errors exceeded threshold. Check credentials. Dashboard: /d/archaser-billing-connector-stag/billing-connector-staging — filter Loki by account_id."
        labels:
          severity: critical
          type: billing_connector

      - uid: bc-in-error-stag
        title: Billing Connectors In Error State
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: sum(archaser_billing_connector_connectors_in_error{instance="Staging", nest_service="archaser-api"}) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: One or more billing connectors in Error status (staging)
          description: "Connector circuit breaker or connection failure. Admin → Billing integration. Dashboard: /d/archaser-billing-connector-stag/billing-connector-staging"
        labels:
          severity: critical
          type: billing_connector

      - uid: bc-stale-incremental-stag
        title: Billing Connector No Incremental Success 24h
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_billing_connector_stale_incremental_count{instance="Staging", nest_service="archaser-api"} or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 15m
        annotations:
          summary: Incremental connector(s) without success in 24h (staging)
          description: "Check schedule, Loki finish lines, and Mongo sync history. Dashboard: /d/archaser-billing-connector-stag/billing-connector-staging"
        labels:
          severity: high
          type: billing_connector

      - uid: bc-incr-failed-stag
        title: Billing Connector Incremental FAILED/TIMEOUT
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: Prometheus
            model:
              expr: sum(increase(archaser_billing_connector_sync_total{instance="Staging", sync_mode="INCREMENTAL", status=~"FAILED|TIMEOUT"}[1h])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Incremental sync FAILED or TIMEOUT (staging)
          description: "Inspect Loki finish/error lines and error_type. Dashboard: /d/archaser-billing-connector-stag/billing-connector-staging"
        labels:
          severity: high
          type: billing_connector

      - uid: bc-backfill-stale-stag
        title: Billing Connector Backfill Checkpoint Stale
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: (time() - archaser_billing_connector_last_checkpoint_timestamp{instance="Staging", nest_service="archaser-api"}) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 86400
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          summary: Active backfill checkpoint older than 24h (staging)
          description: "Resume or reset backfill; check worker/cron Sync Billing Connectors. Dashboard: /d/archaser-billing-connector-stag/billing-connector-staging"
        labels:
          severity: warning
          type: billing_connector

      - uid: bc-stale-running-stag
        title: Billing Connector Stale RUNNING
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: archaser_billing_connector_stale_running_count{instance="Staging", nest_service="archaser-api"} or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: Stale RUNNING sync execution(s) in Mongo (staging)
          description: "collection connector_sync_executions. Sweeper should TIMEOUT; check MONGODB_URI on API. Dashboard: /d/archaser-billing-connector-stag/billing-connector-staging"
        labels:
          severity: warning
          type: billing_connector

      - uid: bc-partial-storm-stag
        title: Billing Connector Incremental PARTIAL Storm
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: Prometheus
            model:
              expr: sum(increase(archaser_billing_connector_sync_total{instance="Staging", sync_mode="INCREMENTAL", status="PARTIAL"}[6h])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 15m
        annotations:
          summary: Repeated incremental PARTIAL syncs (staging)
          description: "Partial imports often mean mapping/validation issues. Dashboard: /d/archaser-billing-connector-stag/billing-connector-staging"
        labels:
          severity: warning
          type: billing_connector

      - uid: bc-rate-limit-5xx-stag
        title: Billing Connector rate_limit / 5xx Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: Prometheus
            model:
