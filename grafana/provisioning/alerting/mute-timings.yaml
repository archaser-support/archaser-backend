apiVersion: 1

# Always-on mute for the staging notification route. Suppresses all outbound
# notifications while alerts stay visible in Grafana UI.
muteTimes:
  - orgId: 1
    name: staging-no-notify
    time_intervals:
      - location: UTC
        weekdays:
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday
        times:
          - start_time: "00:00"
            end_time: "24:00"
