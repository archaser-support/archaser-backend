apiVersion: 1

contactPoints:
  # SNS Webhook Contact Point - Primary notification channel
  # Sends alerts to AWS Lambda which publishes to SNS for fan-out to email, Slack, SMS, etc.
  - orgId: 1
    name: sns-alerts
    receivers:
      - uid: webhook-sns
        type: webhook
        settings:
          # URL is set by environment variable GRAFANA_SNS_WEBHOOK_URL
          # Format: https://xxxxx.execute-api.eu-north-1.amazonaws.com/v1/alert
          url: ${GRAFANA_SNS_WEBHOOK_URL}
          httpMethod: POST
          # Authorization header can be added if needed
          # authorization_scheme: Bearer
          # authorization_credentials: ${SNS_WEBHOOK_AUTH_TOKEN}
        disableResolveMessage: false

  # Staging-only sink: alerts remain visible in Grafana but never reach SNS/email.
  # The staging notification route uses mute_time_intervals so this receiver is not invoked;
  # the localhost URL is a fallback if mute timing is ever removed.
  - orgId: 1
    name: silent-staging
    receivers:
      - uid: silent-staging-discard
        type: webhook
        settings:
          url: http://127.0.0.1:9
          httpMethod: POST
        disableResolveMessage: true
