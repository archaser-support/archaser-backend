apiVersion: 1

policies:
  - orgId: 1
    # Default: production digest tier (severity high + medium, and any non-critical)
    receiver: sns-alerts
    group_by: ["..."]
    group_wait: 30m
    group_interval: 30m
    repeat_interval: 24h
    routes:
      # Staging folder: visible in Grafana, zero outbound notifications
      - receiver: silent-staging
        object_matchers:
          - ["grafana_folder", "=", "Staging"]
        mute_time_intervals:
          - staging-no-notify
        continue: false

      # Production critical: immediate paging (~1-2 min effective latency)
      - receiver: sns-alerts
        object_matchers:
          - ["severity", "=", "critical"]
        group_by: ["..."]
        group_wait: 1m
        group_interval: 5m
        repeat_interval: 4h
        continue: false
