global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Scrapes Nest via the backend compose network (see docker-compose.logging.yml
# networks.backend → archaser-backend-production_default). Service names: api, worker, …
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "archaser-api"
    metrics_path: "/metrics"
    static_configs:
      # Nest production compose listens on 4010 (staging uses 3010)
      - targets: ["api:4010"]
    relabel_configs:
      - target_label: instance
        replacement: "Production"
      - target_label: nest_service
        replacement: "archaser-api"

  - job_name: "archaser-worker"
    metrics_path: "/metrics"
    static_configs:
      # Nest production compose listens on 4003 (staging uses 3003)
      - targets: ["worker:4003"]
    relabel_configs:
      - target_label: instance
        replacement: "Production"
      - target_label: nest_service
        replacement: "archaser-worker"

  - job_name: "archaser-sms"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["sms:3004"]
    relabel_configs:
      - target_label: instance
        replacement: "Production"
      - target_label: nest_service
        replacement: "archaser-sms"

  - job_name: "archaser-connectors"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["connectors:3005"]
    relabel_configs:
      - target_label: instance
        replacement: "Production"
      - target_label: nest_service
        replacement: "archaser-connectors"

  - job_name: "archaser-reports"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["reports:3006"]
    relabel_configs:
      - target_label: instance
        replacement: "Production"
      - target_label: nest_service
        replacement: "archaser-reports"
