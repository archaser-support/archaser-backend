server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: pm2_logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: pm2
      service: archaser-core
      host: production
      environment: production
      source: pm2-logs
      customer_id: system
      __path__: /var/log/pm2/*.log

  pipeline_stages:
  - multiline:
      firstline: '^\d{4}-\d{2}-\d{2}'
      max_wait_time: 3s
  - regex:
      source: filename
      expression: '(?P<app_name>archaser-[^/-]+)-(?P<log_type>out|error)\.log'
  - regex:
      # Try to extract level from log line like "[ERROR]" or "level=error"
      expression: '(?i)\[(?P<extracted_level>error|err|warn|warning|info|debug)\]|level=(?P<level_val>\w+)'
  - labels:
      app_name:
      log_type:
  # Map extracted level OR log_type (error log file) to the 'level' label
  - template:
      source: level
      template: '{{ if .extracted_level }}{{ .extracted_level }}{{ else if eq .log_type "error" }}error{{ else }}info{{ end }}'
  - labels:
      level:
