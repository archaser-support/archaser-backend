global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Local laptop: scrape Nest on the host (npm run dev:all), not Docker service DNS.
# Podman reaches the host via host.containers.internal.
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "archaser-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.containers.internal:3002"]
    relabel_configs:
      - target_label: instance
        replacement: "Staging"
      - target_label: nest_service
        replacement: "archaser-api"

  - job_name: "archaser-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.containers.internal:3003"]
    relabel_configs:
      - target_label: instance
        replacement: "Staging"
      - target_label: nest_service
        replacement: "archaser-worker"

  - job_name: "archaser-sms"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.containers.internal:3004"]
    relabel_configs:
      - target_label: instance
        replacement: "Staging"
      - target_label: nest_service
        replacement: "archaser-sms"

  - job_name: "archaser-connectors"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.containers.internal:3005"]
    relabel_configs:
      - target_label: instance
        replacement: "Staging"
      - target_label: nest_service
        replacement: "archaser-connectors"

  - job_name: "archaser-reports"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.containers.internal:3006"]
    relabel_configs:
      - target_label: instance
        replacement: "Staging"
      - target_label: nest_service
        replacement: "archaser-reports"
