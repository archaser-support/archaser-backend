# Variable substitution (${GRAFANA_SMTP_HOST}, etc.) uses the Compose env file:
#   cd backend/grafana
#   docker compose --env-file ../.env -f docker-compose.logging.yml up -d
#
# Staging domain (default): https://grafana.staging.archaser.com
# Production override in backend/.env:
#   GRAFANA_ROOT_URL=https://grafana.portal.archaser.com/
#   GRAFANA_DOMAIN=grafana.portal.archaser.com
#   MONITORING_ENV=production

services:
  loki:
    image: grafana/loki:3.4.2
    container_name: archaser-loki
    ports:
      # Private-VPC / Lambda push; do not open 3100 publicly in the SG.
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - archaser-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana-db:
    image: postgres:16-alpine
    container_name: archaser-grafana-db
    environment:
      - POSTGRES_USER=${GRAFANA_INTERNAL_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${GRAFANA_INTERNAL_DB_PASSWORD:-postgres}
      - POSTGRES_DB=${GRAFANA_INTERNAL_DB_NAME:-grafana}
    volumes:
      - grafana-db-data-v2:/var/lib/postgresql/data
    networks:
      - archaser-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.5.2
    container_name: archaser-grafana
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://grafana.staging.archaser.com/}
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-grafana.staging.archaser.com}
      - GF_SERVER_HTTP_PORT=3000
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # SMTP Configuration
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-true}
      - GF_SMTP_HOST=${GRAFANA_SMTP_HOST:-}
      - GF_SMTP_USER=${GRAFANA_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GRAFANA_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GRAFANA_SMTP_FROM:-}
      - GF_SMTP_FROM_NAME=ARChaser Grafana
      - GRAFANA_SNS_WEBHOOK_URL=${GRAFANA_SNS_WEBHOOK_URL:-}
      # App Postgres (dashboards / explore) — not the Grafana metadata DB
      - GRAFANA_DB_HOST=${GRAFANA_DB_HOST:-host.docker.internal}
      - GRAFANA_DB_PORT=${GRAFANA_DB_PORT:-5432}
      - GRAFANA_DB_NAME=${GRAFANA_DB_NAME:-archaser_local}
      - GRAFANA_DB_USER=${GRAFANA_DB_USER:-postgres}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-postgres}
      - GRAFANA_DB_SSLMODE=${GRAFANA_DB_SSLMODE:-disable}
      # Grafana metadata DB
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=grafana-db:5432
      - GF_DATABASE_NAME=${GRAFANA_INTERNAL_DB_NAME:-grafana}
      - GF_DATABASE_USER=${GRAFANA_INTERNAL_DB_USER:-postgres}
      - GF_DATABASE_PASSWORD=${GRAFANA_INTERNAL_DB_PASSWORD:-postgres}
      - GF_DATABASE_SSL_MODE=disable
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboard.yaml:ro
      - ./provisioning/dashboards/${MONITORING_ENV:-staging}:/etc/grafana/provisioning/dashboards_files/current_env:ro
      - ./provisioning/alerting/rules-${MONITORING_ENV:-staging}.yaml:/etc/grafana/provisioning/alerting/rules.yaml:ro
      - ./provisioning/alerting/contact-points.yaml:/etc/grafana/provisioning/alerting/contact-points.yaml:ro
      - ./provisioning/alerting/mute-timings.yaml:/etc/grafana/provisioning/alerting/mute-timings.yaml:ro
      - ./provisioning/alerting/notification-policies.yaml:/etc/grafana/provisioning/alerting/notification-policies.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      loki:
        condition: service_healthy
      grafana-db:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - archaser-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: archaser-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - archaser-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    container_name: archaser-promtail
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
      # PM2 logs (production EC2); override path on staging if unused
      - ${PM2_LOGS_HOST_PATH:-/home/ubuntu/logs}:/var/log/pm2:ro
      # Nest / compose container logs on staging API host
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - archaser-network
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
  grafana-db-data-v2:
  prometheus-data:

networks:
  archaser-network:
    driver: bridge
