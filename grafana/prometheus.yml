global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Deprecated: prefer prometheus-staging.yml / prometheus-production.yml
# (docker-compose.logging.yml mounts prometheus-${MONITORING_ENV}.yml).
# Kept as a Staging alias for older docs/scripts.
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "archaser-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:3010"]
    relabel_configs:
      - target_label: instance
        replacement: "Staging"
      - target_label: nest_service
        replacement: "archaser-api"

  - job_name: "archaser-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:3003"]
    relabel_configs:
      - target_label: instance
        replacement: "Staging"
      - target_label: nest_service
        replacement: "archaser-worker"

  - job_name: "archaser-sms"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["sms:3004"]
    relabel_configs:
      - target_label: instance
        replacement: "Staging"
      - target_label: nest_service
        replacement: "archaser-sms"

  - job_name: "archaser-connectors"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["connectors:3005"]
    relabel_configs:
      - target_label: instance
        replacement: "Staging"
      - target_label: nest_service
        replacement: "archaser-connectors"

  - job_name: "archaser-reports"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["reports:3006"]
    relabel_configs:
      - target_label: instance
        replacement: "Staging"
      - target_label: nest_service
        replacement: "archaser-reports"
