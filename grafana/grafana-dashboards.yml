apiVersion: 1

# One provider; subfolders under the env mount become Grafana folders
# (Dashboards /, api /, worker /). See provisioning/dashboards/{staging|production}/.
providers:
  - name: 'ARChaser'
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards_files/current_env
      foldersFromFilesStructure: true
