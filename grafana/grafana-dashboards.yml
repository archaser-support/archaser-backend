apiVersion: 1

# All boards in one Grafana folder. (Alert rules still use folder "Staging" /
# "Production" — that is separate from dashboards.)
providers:
  - name: 'ARChaser'
    orgId: 1
    folder: 'Dashboards'
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards_files/current_env
      foldersFromFilesStructure: false
