AWSTemplateFormatVersion: '2010-09-09'
Description: 'ARChaser Alert SNS Infrastructure - Grafana webhook to SNS with HTML email and detailed alerts'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
    Description: Environment name

  AlertEmailAddress:
    Type: String
    Default: nilotpal@archaser.com,ofir@cloudial.io
    Description: Email addresses for alert notifications (comma-separated for multiple, e.g., user1@example.com,user2@example.com)

  SESFromAddress:
    Type: String
    Default: alerts@archaser.com
    Description: Verified SES email address to send from

  AlertDetailsApiUrl:
    Type: String
    Default: https://portal.archaser.com/api/alert-details
    Description: URL of the application API for fetching alert details

  AlertDetailsApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: API key for authenticating with the alert details API

  ClickUpChatToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: ClickUp Chat API token. Empty skips Chat posts (email and SNS still send).

  ClickUpChatChannelId:
    Type: String
    Default: ''
    Description: ARchaser ClickUp Chat channel id. Empty skips Chat posts.

  ClickUpChatWorkspaceId:
    Type: String
    Default: ''
    Description: Optional ClickUp workspace id if the Chat API requires workspace scope.

  ClickUpChatEnabled:
    Type: String
    Default: ''
    Description: Optional Chat toggle (true/false). Empty means enabled when token and channel id are both set.

  GrafanaBaseUrl:
    Type: String
    Default: ''
    Description: >-
      Grafana public base URL (no trailing slash). Empty uses Environment defaults:
      production → https://grafana.production.archaser.com,
      staging → https://grafana.staging.archaser.com.
      Do not use https://grafana.archaser.com (that host serves the Next.js app).

Resources:
  # SNS Topic for System Alerts (for Slack and other subscribers)
  AlertSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'archaser-system-alerts-${Environment}'
      DisplayName: 'ARChaser System Alerts'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: archaser

  # SNS Topic Policy - allows Lambda to publish
  AlertSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertSNSTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLambdaPublish
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertSNSTopic
            Condition:
              ArnLike:
                aws:SourceArn: !GetAtt AlertWebhookLambda.Arn

  # IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'archaser-alert-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SNSAndSESPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref AlertSNSTopic
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt AlertCooldownTable.Arn

  # Lambda Function - Grafana Webhook to SNS + SES Bridge with Details
  AlertWebhookLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'archaser-alert-webhook-${Environment}'
      Runtime: nodejs18.x
      Handler: handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AlertSNSTopic
          ALERT_EMAIL: !Ref AlertEmailAddress
          SES_FROM_ADDRESS: !Ref SESFromAddress
          AWS_SES_REGION: !Ref AWS::Region
          ALERT_DETAILS_API_URL: !Ref AlertDetailsApiUrl
          ALERT_DETAILS_API_KEY: !Ref AlertDetailsApiKey
          ENVIRONMENT: !Ref Environment
          COOLDOWN_TABLE_NAME: !Ref AlertCooldownTable
          CLICKUP_CHAT_TOKEN: !Ref ClickUpChatToken
          CLICKUP_CHAT_CHANNEL_ID: !Ref ClickUpChatChannelId
          CLICKUP_CHAT_WORKSPACE_ID: !Ref ClickUpChatWorkspaceId
          CLICKUP_CHAT_ENABLED: !Ref ClickUpChatEnabled
          GRAFANA_BASE_URL: !Ref GrafanaBaseUrl
      # Real code is packaged from infrastructure/sns/lambda/ by deploy.sh
      # (aws lambda update-function-code). Stub keeps stack create/update valid.
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              success: false,
              error: 'Lambda package not deployed. Run infrastructure/sns/deploy.sh',
            }),
          });

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: archaser

  # Cooldown Table for Alerts
  AlertCooldownTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'archaser-alert-cooldown-${Environment}'
      AttributeDefinitions:
        - AttributeName: AlertName
          AttributeType: S
      KeySchema:
        - AttributeName: AlertName
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: archaser

  # API Gateway REST API
  AlertWebhookApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'archaser-alert-webhook-${Environment}'
      Description: 'Webhook endpoint for Grafana alerts'
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway Resource
  WebhookResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AlertWebhookApi
      ParentId: !GetAtt AlertWebhookApi.RootResourceId
      PathPart: alert

  # API Gateway Method
  WebhookMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AlertWebhookApi
      ResourceId: !Ref WebhookResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AlertWebhookLambda.Arn}/invocations'

  # Lambda Permission for API Gateway
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AlertWebhookLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AlertWebhookApi}/*/*/*'

  # API Gateway Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: WebhookMethod
    Properties:
      RestApiId: !Ref AlertWebhookApi

  # API Gateway Stage
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref AlertWebhookApi
      DeploymentId: !Ref ApiDeployment
      StageName: v1
      Description: 'Production stage for alert webhook'

Outputs:
  SNSTopicArn:
    Description: 'ARN of the SNS Topic for alerts (use for Slack integration)'
    Value: !Ref AlertSNSTopic
    Export:
      Name: !Sub '${AWS::StackName}-SNSTopicArn'

  WebhookUrl:
    Description: 'Webhook URL for Grafana to send alerts'
    Value: !Sub 'https://${AlertWebhookApi}.execute-api.${AWS::Region}.amazonaws.com/v1/alert'
    Export:
      Name: !Sub '${AWS::StackName}-WebhookUrl'

  LambdaFunctionArn:
    Description: 'ARN of the Lambda function'
    Value: !GetAtt AlertWebhookLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'
