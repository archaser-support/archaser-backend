name: Deploy Backend to EC2

on:
  push:
    branches:
      - staging
      - master
      - main

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    uses: ./.github/workflows/typecheck.yml

  deploy:
    name: Deploy Backend Docker Containers to EC2
    needs: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Environment & Directory
        id: env-name
        run: |
          # Staging and production share one EC2 git checkout; --env selects compose/env.
          echo "APP_DIR=/home/ubuntu/api" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENV=production" >> $GITHUB_OUTPUT
          else
            echo "ENV=staging" >> $GITHUB_OUTPUT
          fi

      # Public S3 JSON polled by Amplify UI (maintenance overlay). Skips if secrets unset.
      - name: Configure AWS for deploy status
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_STATUS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_STATUS_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEPLOY_STATUS_AWS_REGION || 'eu-north-1' }}

      - name: Set deploy status (on)
        continue-on-error: true
        env:
          DEPLOY_STATUS_S3_BUCKET: ${{ secrets.DEPLOY_STATUS_S3_BUCKET }}
          DEPLOY_STATUS_S3_PREFIX: ${{ secrets.DEPLOY_STATUS_S3_PREFIX }}
        run: |
          bash scripts/deployment/set-deploy-status.sh \
            --env "${{ steps.env-name.outputs.ENV }}" \
            --deploying true

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            echo "==> Deploying backend (${{ steps.env-name.outputs.ENV }}) on EC2 in ${{ steps.env-name.outputs.APP_DIR }}..."
            cd ${{ steps.env-name.outputs.APP_DIR }}
            git fetch origin
            git checkout ${{ github.ref_name }}
            # Discard local EC2 hotfixes so pull/reset always matches the branch tip.
            # Stash first (keeps a recoverable copy); then hard-reset to origin.
            if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              echo "==> Local EC2 changes detected; stashing before reset..."
              git stash push -u -m "deploy-auto-stash ${{ github.ref_name }} $(date -u +%Y%m%dT%H%M%SZ)" || true
            fi
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd
            bash scripts/deployment/deploy-backend-docker.sh --env ${{ steps.env-name.outputs.ENV }} --app-dir ${{ steps.env-name.outputs.APP_DIR }}

      - name: Clear deploy status (off)
        if: always()
        continue-on-error: true
        env:
          DEPLOY_STATUS_S3_BUCKET: ${{ secrets.DEPLOY_STATUS_S3_BUCKET }}
          DEPLOY_STATUS_S3_PREFIX: ${{ secrets.DEPLOY_STATUS_S3_PREFIX }}
        run: |
          bash scripts/deployment/set-deploy-status.sh \
            --env "${{ steps.env-name.outputs.ENV }}" \
            --deploying false
