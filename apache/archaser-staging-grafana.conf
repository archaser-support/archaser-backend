# Staging Grafana — grafana.staging.archaser.com (Apache 2)
#
# Monitoring containers are independent of Apache. Start them with Docker Compose
# (or deploy-backend-docker.sh --env staging). This vhost only exposes Grafana.
#
# One-time on the staging API EC2:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#   sudo cp backend/apache/archaser-staging-grafana.conf \
#     /etc/apache2/sites-available/archaser-staging-grafana.conf
#   sudo a2ensite archaser-staging-grafana
#   # HTTP-only first if certs are missing, then:
#   sudo certbot --apache -d grafana.staging.archaser.com
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Requires Grafana on 127.0.0.1:3002 (grafana/docker-compose.logging.yml).

<VirtualHost *:80>
    ServerName grafana.staging.archaser.com

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName grafana.staging.archaser.com

    SSLEngine on
    # certbot --apache usually fills these; placeholders until first cert issue:
    SSLCertificateFile      /etc/letsencrypt/live/grafana.staging.archaser.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/grafana.staging.archaser.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Live / WebSocket (Grafana alerting UI, etc.)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:3002/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)           http://127.0.0.1:3002/$1 [P,L]

    ProxyPass        / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    ProxyTimeout 300
</VirtualHost>
</IfModule>
